services:
  pg-primary:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: -c wal_level=replica
      -c max_wal_senders=10
      -c wal_keep_size=64MB
      -c listen_addresses=*
      -c log_replication_commands=on
      -c hba_file=/etc/postgresql/pg_hba.conf

  pg-standby:
    image: postgres:17
    depends_on:
      - pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15433:5432"
    volumes:
      - pg-standby-data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    entrypoint: [
      "/bin/bash",
      "-c",
      "
        rm -rf /var/lib/postgresql/data/* &&
        until pg_basebackup -h pg-primary -D /var/lib/postgresql/data -U postgres -Fp -Xs -P -R; do
        echo 'Waiting for primary...';
        sleep 2;
        done &&
        exec docker-entrypoint.sh postgres -c hba_file=/etc/postgresql/pg_hba.conf -c log_replication_commands=on -c hot_standby=on
        ",
    ]

  # SeaweedFS all-in-one (master + volume + filer + S3 gateway + admin UI in one process).
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY create the admin identity,
  # S3_BUCKET pre-creates the bucket.
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    container_name: seaweedfs
    command:
      - mini
      - -s3.port=9000
      - -s3.cert.file=/certs/public.crt
      - -s3.key.file=/certs/private.key
      - -admin.user=s3admin
      - -admin.password=s3admin123
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    ports:
      - "9000:9000"  # S3 API (HTTPS)
      - "9001:12535" # Admin UI (HTTP)
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin123
      S3_BUCKET: backups
    volumes:
      - seaweedfs_data:/data
      - ./files/seaweedfs/certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-kfs", "https://localhost:9000/healthz"]
      interval: 2s
      timeout: 20s
      retries: 30
    restart: unless-stopped

  # Enable versioning on the bucket pre-created via S3_BUCKET.
  # TLS is verified against the test cert (SAN: seaweedfs).
  createbuckets:
    image: amazon/aws-cli:2.42.5
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin123
      AWS_DEFAULT_REGION: main
      AWS_ENDPOINT_URL: https://seaweedfs:9000
      AWS_CA_BUNDLE: /certs/public.crt
    volumes:
      - ./files/seaweedfs/certs:/certs:ro
    entrypoint:
      - sh
      - -ec
      - |
        aws configure set default.s3.addressing_style path
        # S3_BUCKET is created shortly after seaweedfs reports healthy
        aws s3api wait bucket-exists --bucket backups
        aws s3api put-bucket-versioning --bucket backups --versioning-configuration Status=Enabled
    restart: "no"

volumes:
  pg-primary-data:
  pg-standby-data:
  seaweedfs_data:
