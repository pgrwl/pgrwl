---
main:
  listen_port: 7070
  directory: wals

receiver:
  slot: pgrwl_v5
  uploader:
    sync_interval: 10s
    max_concurrency: 4

metrics:
  enable: true

debug_config:
  enable_pprof: true

log:
  level: debug
  format: pretty
  add_source: true

storage:
  name: s3
  compression:
    algo: gzip
  #encryption:
  #  algo: aes-256-gcm
  #  pass: qwerty123
  s3:
    url: "https://localhost:9000"
    access_key_id: s3admin
    secret_access_key: s3admin123
    bucket: backups
    region: main
    use_path_style: true
    disable_ssl: true

backup:
  cron: "* * * * *"

retention:
  enable: true
  type: recovery_window
  value: "5m"
  keep_last: 1
