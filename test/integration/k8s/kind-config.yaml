kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://kind-registry:5000"]
name: "pgrwl"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 30000
      # postgres
      - containerPort: 30265
        hostPort: 30265
        protocol: TCP
      # pgrwl-receive
      - containerPort: 30266
        hostPort: 30266
        protocol: TCP
      # seaweedfs-admin-ui
      - containerPort: 30267
        hostPort: 30267
        protocol: TCP
      # seaweedfs-s3
      - containerPort: 30268
        hostPort: 30268
        protocol: TCP
      # prometheus
      - containerPort: 30269
        hostPort: 30269
        protocol: TCP
      # grafana
      - containerPort: 30270
        hostPort: 30270
        protocol: TCP
      # pgrwl-basebackup
      - containerPort: 30271
        hostPort: 30271
        protocol: TCP
      # pgrwl-ui
      - containerPort: 30272
        hostPort: 30272
        protocol: TCP
